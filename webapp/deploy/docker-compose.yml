# Studio, the whole stack on one machine:  docker compose -f webapp/deploy/docker-compose.yml up --build
# Then open http://localhost:3000 . Configuration: webapp/.env (copy webapp/.env.example).
name: studio

x-backend: &backend
  env_file: ../.env
  environment:
    DATABASE_URL: postgresql+psycopg://studio:studio@postgres:5432/studio
    REDIS_URL: redis://redis:6379/0
    S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://s3:8333}
    S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: studio, POSTGRES_PASSWORD: studio, POSTGRES_DB: studio }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U studio"], interval: 5s, retries: 20 }
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 20 }
    restart: unless-stopped

  s3:                         # local S3 (SeaweedFS; MinIO's images left Docker Hub); in production use S3 or R2
    image: chrislusf/seaweedfs:4.54
    command: ["mini", "-dir=/data", "-admin.ui=false"]
    environment: { AWS_ACCESS_KEY_ID: studio, AWS_SECRET_ACCESS_KEY: studio-dev-secret }
    ports: ["9000:8333"]
    volumes: [media:/data]
    healthcheck: { test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"], interval: 5s, retries: 30 }
    restart: unless-stopped

  migrate:
    <<: *backend
    build: { context: ../.., dockerfile: webapp/deploy/backend.Dockerfile, target: api }
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *backend
    build: { context: ../.., dockerfile: webapp/deploy/backend.Dockerfile, target: api }
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      s3: { condition: service_healthy }

  # Two pools from one image (app/queue.py): media jobs (ingest, transcribe, render, qa, library scans) and Claude
  # turns, so a turn waiting on a lead's approval never holds up an upload. Each worker keeps its own /work.
  worker-media:
    <<: *backend
    build: { context: ../.., dockerfile: webapp/deploy/backend.Dockerfile, target: worker }
    command: ["python", "-m", "worker.main", "--queues", "media"]
    user: studio                    # no Claude here: no need for root or the agent user
    environment:
      DATABASE_URL: postgresql+psycopg://studio:studio@postgres:5432/studio
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://s3:8333}
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      WORKER_MEDIA_USER: ""
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy: { replicas: 2 }

  worker-agent:
    <<: *backend
    build: { context: ../.., dockerfile: webapp/deploy/backend.Dockerfile, target: worker }
    command: ["python", "-m", "worker.main", "--queues", "agent"]
    environment:                    # set here too, so nothing in webapp/.env can switch the isolation off
      DATABASE_URL: postgresql+psycopg://studio:studio@postgres:5432/studio
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://s3:8333}
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      AGENT_USER: studio-agent
      WORKER_MEDIA_USER: studio
      AGENT_SANDBOX: "true"
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy: { replicas: 1 }
    # Claude Code's sandbox (bubblewrap) needs user namespaces, which Docker's default seccomp profile blocks. This
    # lifts seccomp filtering for the Claude workers only; production should use a profile that allows just
    # unshare/clone with namespaces instead (docs/DEPLOY.md, "Claude workers"). Without either, turns fail closed.
    security_opt: ["seccomp=unconfined"]

  web:
    build: { context: ../.., dockerfile: webapp/deploy/web.Dockerfile, args: { API_URL: "http://api:8000" } }
    ports: ["3000:3000"]
    depends_on: [api]
    restart: unless-stopped

volumes: { pgdata: {}, media: {} }
