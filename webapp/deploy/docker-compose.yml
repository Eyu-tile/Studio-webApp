# Studio, the whole stack on one machine:  docker compose -f webapp/deploy/docker-compose.yml up --build
# Then open http://localhost:3000 . Configuration: webapp/.env (copy webapp/.env.example).
name: studio

x-backend: &backend
  env_file: ../.env
  environment:
    DATABASE_URL: postgresql+psycopg://studio:studio@postgres:5432/studio
    REDIS_URL: redis://redis:6379/0
    S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
    S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: studio, POSTGRES_PASSWORD: studio, POSTGRES_DB: studio }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U studio"], interval: 5s, retries: 20 }
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 20 }
    restart: unless-stopped

  minio:                      # local S3; in production use S3 or R2 and drop this service
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: studio, MINIO_ROOT_PASSWORD: studio-dev-secret }
    ports: ["9000:9000", "9001:9001"]
    volumes: [media:/data]
    healthcheck: { test: ["CMD", "mc", "ready", "local"], interval: 5s, retries: 20 }
    restart: unless-stopped

  migrate:
    <<: *backend
    build: { context: ../.., dockerfile: webapp/deploy/backend.Dockerfile, target: api }
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *backend
    build: { context: ../.., dockerfile: webapp/deploy/backend.Dockerfile, target: api }
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

  worker:
    <<: *backend
    build: { context: ../.., dockerfile: webapp/deploy/backend.Dockerfile, target: worker }
    depends_on:
      migrate: { condition: service_completed_successfully }
    volumes: [work:/work]
    deploy: { replicas: 2 }

  web:
    build: { context: ../.., dockerfile: webapp/deploy/web.Dockerfile, args: { API_URL: "http://api:8000" } }
    ports: ["3000:3000"]
    depends_on: [api]
    restart: unless-stopped

volumes: { pgdata: {}, media: {}, work: {} }
